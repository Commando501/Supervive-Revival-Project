<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUPERVIVE Revival — Admin</title>
<style>
  :root {
    --bg: #0d1017; --bg2: #141926; --bg3: #1b2233; --line: #2a3350;
    --fg: #dbe2f4; --dim: #8b94ad; --accent: #7c5cff; --accent2: #35d0ba;
    --warn: #e8b339; --danger: #e05a6d; --ok: #4fca7c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  a { color: var(--accent2); }

  header { display: flex; align-items: baseline; gap: 14px; padding: 14px 22px;
           background: var(--bg2); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .06em; }
  header h1 b { color: var(--accent); }
  header .sub { color: var(--dim); font-size: 12px; }

  .layout { display: flex; min-height: calc(100vh - 55px); }
  nav { width: 190px; flex: none; background: var(--bg2); border-right: 1px solid var(--line);
        padding: 12px 0; }
  nav button { display: block; width: 100%; text-align: left; padding: 10px 20px;
               background: none; border: none; color: var(--dim); font: inherit;
               cursor: pointer; border-left: 3px solid transparent; }
  nav button:hover { color: var(--fg); }
  nav button.on { color: var(--fg); background: var(--bg3); border-left-color: var(--accent); }
  main { flex: 1; padding: 20px 26px 80px; max-width: 1100px; }

  h2 { font-size: 16px; margin: 4px 0 12px; }
  h3 { font-size: 13.5px; margin: 18px 0 8px; color: var(--accent2); text-transform: uppercase;
       letter-spacing: .08em; }
  .note { background: var(--bg3); border: 1px solid var(--line); border-left: 3px solid var(--accent2);
          padding: 8px 12px; border-radius: 4px; color: var(--dim); font-size: 12.5px; margin: 10px 0; }
  .note.warn { border-left-color: var(--warn); }
  .note b { color: var(--fg); }

  .card { background: var(--bg2); border: 1px solid var(--line); border-radius: 6px;
          padding: 14px 16px; margin: 12px 0; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }

  input[type=text], input[type=number], select, textarea {
    background: var(--bg); color: var(--fg); border: 1px solid var(--line);
    border-radius: 4px; padding: 6px 9px; font: inherit; }
  input[type=number] { width: 90px; }
  textarea { width: 100%; min-height: 180px; font: 12px/1.5 Consolas, monospace; }
  input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); }
  label.chk { display: flex; gap: 7px; align-items: center; padding: 3px 6px; border-radius: 3px;
              cursor: pointer; }
  label.chk:hover { background: var(--bg3); }
  label.chk.off span { color: var(--dim); }

  button.btn { background: var(--bg3); border: 1px solid var(--line); color: var(--fg);
               border-radius: 4px; padding: 6px 14px; font: inherit; cursor: pointer; }
  button.btn:hover { border-color: var(--accent); }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.btn.danger { border-color: var(--danger); color: var(--danger); }
  button.btn.mini { padding: 2px 8px; font-size: 12px; }

  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 5px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 600; font-size: 12px; text-transform: uppercase;
       letter-spacing: .05em; }
  tr:hover td { background: var(--bg3); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 2px; }
  .listbox { max-height: 420px; overflow-y: auto; border: 1px solid var(--line);
             border-radius: 4px; padding: 6px; background: var(--bg); }
  .counts { color: var(--dim); font-size: 12px; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11.5px;
          background: var(--bg3); border: 1px solid var(--line); color: var(--dim); }
  .pill.ok { color: var(--ok); border-color: var(--ok); }
  .pill.warn { color: var(--warn); border-color: var(--warn); }

  #savebar { position: fixed; bottom: 0; left: 190px; right: 0; padding: 10px 26px;
             background: var(--bg2); border-top: 1px solid var(--line); display: none;
             align-items: center; gap: 14px; z-index: 5; }
  #savebar.show { display: flex; }
  #savebar .dirty { color: var(--warn); font-size: 12.5px; }

  #toast { position: fixed; top: 14px; right: 16px; z-index: 10; display: flex;
           flex-direction: column; gap: 8px; }
  .toastmsg { background: var(--bg3); border: 1px solid var(--ok); color: var(--fg);
              border-radius: 5px; padding: 9px 14px; font-size: 13px; max-width: 420px;
              box-shadow: 0 4px 18px rgba(0,0,0,.45); }
  .toastmsg.err { border-color: var(--danger); }
  .mono { font-family: Consolas, monospace; font-size: 12.5px; }
  .kv-row { display: flex; gap: 8px; margin: 4px 0; align-items: center; }
  .kv-row input[type=text] { width: 320px; }
  details { margin: 10px 0; }
  summary { cursor: pointer; color: var(--dim); }

  /* ---- implementation-status dashboard (Overview tab) ---- */
  .bigbar { height: 26px; border-radius: 13px; }
  .pbar { position: relative; height: 16px; background: var(--bg); border: 1px solid var(--line);
          border-radius: 9px; overflow: hidden; }
  .pfill { height: 100%; border-radius: 9px; transition: width .35s ease; }
  .pnum { position: absolute; top: 0; right: 8px; line-height: 16px; font-size: 11px;
          font-weight: 700; color: var(--fg); text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .bigbar .pnum { line-height: 26px; font-size: 14px; right: 12px; }

  .cathead { display: flex; align-items: center; gap: 16px; margin: 22px 0 6px; }
  .cathead h3 { margin: 0; flex: none; min-width: 210px; color: var(--fg);
                text-transform: none; letter-spacing: 0; font-size: 14.5px; }
  .cathead .pbar { flex: 1; max-width: 340px; }
  .cathead .catdesc { color: var(--dim); font-size: 12px; }

  .statrow { display: grid; grid-template-columns: 220px 66px 150px 1fr; gap: 12px;
             align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .statrow:last-child { border-bottom: none; }
  .statname { font-weight: 600; font-size: 13px; }
  .statnote { color: var(--dim); font-size: 12.5px; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 10.5px;
         font-weight: 700; text-transform: uppercase; letter-spacing: .04em; border: 1px solid; }
  .tag.in       { color: var(--ok);     border-color: var(--ok); }
  .tag.partial  { color: var(--warn);   border-color: var(--warn); }
  .tag.blocked  { color: var(--danger); border-color: var(--danger); }
  .tag.planned  { color: var(--dim);    border-color: var(--dim); }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; color: var(--dim); font-size: 12px; margin-top: 6px; }
  .legend .sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 5px;
                vertical-align: middle; }
</style>
</head>
<body>
<header>
  <h1>SUPERVIVE <b>REVIVAL</b> — backend admin</h1>
  <span class="sub" id="cfgpath"></span>
</header>

<div class="layout">
  <nav id="nav"></nav>
  <main id="main"></main>
</div>

<div id="savebar">
  <span class="dirty">Unsaved config changes</span>
  <button class="btn primary" onclick="saveConfig()">Save &amp; apply config</button>
  <button class="btn" onclick="revertConfig()">Discard changes</button>
  <span class="counts">Applies live in the backend; the client picks it up on its next menu re-entry / relaunch.</span>
</div>

<div id="toast"></div>

<script>
"use strict";
/* ------------------------------------------------------------------ state -- */
let DATA = { config: null, defaults: null, path: "" };  // /api/config
let CFG = null;          // working copy the checklists mutate
let dirty = false;
let MISSIONS = { manifest: [], objectives: {}, status: { summary: {}, missions: [] },
                 coverage: { summary: {}, unmappedObjectives: [], unusedRules: [] } };
let PLAYERS = [];
let curTab = "overview";
let curPlayer = null;    // {id, state} being edited

const $ = sel => document.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, err) {
  const d = document.createElement("div");
  d.className = "toastmsg" + (err ? " err" : "");
  d.textContent = msg;
  $("#toast").appendChild(d);
  setTimeout(() => d.remove(), err ? 8000 : 3500);
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || (r.status + " " + r.statusText));
  return body;
}

function setDirty(v) {
  dirty = v;
  $("#savebar").classList.toggle("show", v);
}

/* ---------------------------------------------------------------- loaders -- */
async function loadConfig() {
  DATA = await api("/api/config");
  CFG = JSON.parse(JSON.stringify(DATA.config));
  $("#cfgpath").textContent = DATA.path ? ("config: " + DATA.path) : "config persistence disabled (-config \"\")";
  setDirty(false);
}
async function loadMissions() {
  // Merge defensively instead of wholesale-replacing: if the page is newer than
  // the running ags build (browser kept a tab open across a rebuild), absent
  // keys must not crash the renderers — that's how the panel got stuck on a
  // permanent "Loading…" (2026-07-10).
  const d = await api("/api/missions");
  MISSIONS = {
    manifest:   d.manifest   || [],
    objectives: d.objectives || {},
    status:     d.status     || { summary: {}, missions: [] },
    coverage:   d.coverage   || { summary: {}, unmappedObjectives: [], unusedRules: [] },
  };
}
async function loadPlayers()  { PLAYERS = (await api("/api/players")).players; }

async function saveConfig() {
  try {
    const res = await api("/api/config", { method: "PUT",
      headers: {"Content-Type": "application/json"}, body: JSON.stringify(CFG) });
    if (res.saveError) toast("Applied live, but NOT persisted: " + res.saveError, true);
    else toast("Config saved & applied");
    DATA.config = res.config;
    CFG = JSON.parse(JSON.stringify(res.config));
    setDirty(false);
    render();
  } catch (e) { toast("Save failed: " + e.message, true); }
}
function revertConfig() {
  CFG = JSON.parse(JSON.stringify(DATA.config));
  setDirty(false);
  render();
}

/* ------------------------------------------------------------------- tabs -- */
const TABS = [
  ["overview", "Overview"],
  ["hunters",  "Hunters"],
  ["store",    "Store"],
  ["economy",  "Wallet & Prices"],
  ["missions", "Missions"],
  ["players",  "Players"],
];
function renderNav() {
  $("#nav").innerHTML = TABS.map(([id, label]) =>
    `<button class="${curTab===id?'on':''}" onclick="go('${id}')">${label}</button>`).join("");
}
function go(tab) { curTab = tab; curPlayer = null; render(); }

function render() {
  renderNav();
  const m = $("#main");
  if (!CFG) {
    // Boot hasn't succeeded yet. Show WHY (dead/restarting backend) instead of a
    // bare "Loading…" — and boot() auto-retries until ags answers.
    m.innerHTML = bootError ? `
      <div class="note warn"><b>Can't reach the ags backend:</b> ${esc(bootError)}<br>
        Retrying every 3s — is ags running? (panel = same process, port from the -admin flag)</div>
      <button class="btn" onclick="boot()">Retry now</button>` : "<p>Loading…</p>";
    return;
  }
  try {
    ({overview: renderOverview, hunters: renderHunters, store: renderStore,
      economy: renderEconomy, missions: renderMissions, players: renderPlayers}[curTab])(m);
  } catch (e) {
    // A renderer must never leave stale content behind (looked like a hang).
    m.innerHTML = `<div class="note warn"><b>Render error on this tab:</b> ${esc(e.message)}<br>
      If ags was just rebuilt, hard-refresh (Ctrl+F5) so the page matches the backend.</div>`;
  }
}

/* --------------------------------------------------------------- overview -- */
/* Implementation-status board. Percentages/notes are a hand-curated snapshot of
   what actually works in the client vs. what's still blocked — sourced from
   CLAUDE.md + the memory topic files. Keep this HONEST: bump a % only when the
   underlying feature really moves, and cite the wall in the note when blocked.
   Last curated: 2026-07-23 (S90). */
const STATUS = [
  { cat: "Client Front-End / Menu", desc: "The entire out-of-match menu experience", items: [
    { n: "Login &amp; authentication",          p: 100, s: "in",
      note: "Full 3-service login online; Steam must be running first (else Auth Failure 14005)." },
    { n: "ALL HUNTERS roster",                   p: 100, s: "in",
      note: "Hero grid renders live + click-to-refresh; fixed via the CatMgr+0x354 catalog-ready flag (catalog_store_fix.dll)." },
    { n: "Store (bundles / skins / packs)",      p: 90,  s: "in",
      note: "Storefront advertises &amp; marks owned; per-SKU PRICES are inert (client renders from packed catalog data)." },
    { n: "Cosmetics browser",                    p: 100, s: "in",
      note: "977 cosmetics render with ownership; skins/accessories toggle live from the Store tab." },
    { n: "Missions page",                        p: 100, s: "in",
      note: "Full page + working progress bars via the native-call primitive; progress served per-account." },
    { n: "Passes — Hunter's Journey",            p: 95,  s: "in",
      note: "85-tier ladder renders + live XP/progress earned from matches; seasonal pass &amp; reward CLAIMING still open." },
    { n: "Avatar / Callsign customization",      p: 100, s: "in",
      note: "Renders, switches, persists, updates in ~1.5s — backend-only, no shim." },
    { n: "Wallet",                               p: 80,  s: "partial",
      note: "Vive Points (vp) settable &amp; live; gold Theorycraft Coins aren't wallet-driven (battlepass claim state)." },
  ]},
  { cat: "Backend Infrastructure", desc: "The local Go server (ags) standing in for the dead official backend", items: [
    { n: "Client redirect (ags server)",         p: 100, s: "in",
      note: "hosts-file + self-signed HTTPS redirect of the client onto the local Go backend." },
    { n: "Endpoint surface",                      p: 95,  s: "in",
      note: "Nearly all menu / profile / lobby endpoints handled — see docs/endpoints.md." },
    { n: "Admin panel",                           p: 100, s: "in",
      note: "This loopback GUI + JSON API for hunters, store, wallet, missions, and player state." },
    { n: "Per-account state persistence",         p: 100, s: "in",
      note: "state/interactive.json: selected hunter, backdrop, equips, profile, pass progress." },
    { n: "Mission progress engine",               p: 100, s: "in",
      note: "match-result → objective fan-out + server-computed completion status &amp; coverage." },
    { n: "Pass XP earning",                       p: 100, s: "in",
      note: "Matches grant Hunter's Journey XP against the server-owned non-monotonic 85-tier ladder." },
  ]},
  { cat: "Match / Gameplay", desc: "The current frontier — getting into a playable map", items: [
    { n: "DS netcode (handshake/join/spawn)",    p: 100, s: "in",
      note: "Handshake, login, join, PC-spawn + class-net-cache suppression all verified." },
    { n: "GameState replication",                 p: 100, s: "in",
      note: "ALokiGameState mirror (43 net props) → client leaves the loading screen into the live world." },
    { n: "Pawn replication + possession",         p: 70,  s: "blocked",
      note: "Server spawns+possesses a replicating pawn, but a stock APlayerController blocks the possession-ack (control is tied to the real Loki PC)." },
    { n: "Tutorial force-launch",                 p: 50,  s: "partial",
      note: "Real gamemode/gamestate, world renders, hero spawn/possess/teleport, phases 1→4; blocked — 0 quest objects exist so objectives can't complete." },
    { n: "Player movement",                       p: 20,  s: "blocked",
      note: "CMC per-frame tick pins the game thread → netdriver timeout/disconnect. Fix = stop the CMC tick from blocking." },
    { n: "Game-feature-toggle delivery",          p: 40,  s: "partial",
      note: "RPC signature RE'd + readiness-bit shim, but OnClientGameFeatureTogglesReady never fires → stuck on the drop-in loading overlay." },
    { n: "Playable match",                        p: 10,  s: "planned",
      note: "The end goal — launching into a fully playable map. Not yet reached; converges on the possession + movement walls." },
  ]},
  { cat: "Reverse-Engineering Tooling", desc: "The RE/extraction toolchain everything above is built on", items: [
    { n: "Asset extractor (CUE4Parse)",           p: 100, s: "in",
      note: "enumerate / dump / schema / assetregistry; the full 68,228-asset catalog is mapped." },
    { n: "usmap + RPM RE commands",               p: 100, s: "in",
      note: "mappings.usmap regen + strings/xref/disasm/peek/threads live read-process-memory probes." },
    { n: "Image dump / merge / IAT rebuild",      p: 100, s: "in",
      note: "dumpimage / mergedumps / deobfimports — 1107/1107 VMProtect-protected imports resolved." },
    { n: "Native-call primitive",                 p: 100, s: "in",
      note: "ProcessInternal direct-thunk game-thread calls with params + OUT-params." },
    { n: "Native shims",                          p: 100, s: "in",
      note: "catalog_store_fix, missions_fix, loadout_fix, battlepass_adopt, mainmenu_refresh_pi8… coexist via a shared mutex." },
    { n: "AssetRegistry patch deployment",        p: 60,  s: "partial",
      note: "Extractor patch works end-to-end, but loose-file AR.bin deploy is proven INERT (needs an IoStore mod-pak overlay)." },
  ]},
];

function pctColor(p) {
  if (p >= 90) return "var(--ok)";      // green  — done / live
  if (p >= 60) return "var(--accent2)"; // teal   — mostly there
  if (p >= 35) return "var(--warn)";    // amber  — partial
  return "var(--danger)";               // red    — early / blocked
}
function pbar(p, big) {
  return `<div class="pbar${big ? " bigbar" : ""}">
    <div class="pfill" style="width:${p}%;background:${pctColor(p)}"></div>
    <span class="pnum">${p}%</span></div>`;
}
const catAvg = c => Math.round(c.items.reduce((a, it) => a + it.p, 0) / c.items.length);

function renderOverview(m) {
  const c = CFG, d = DATA.defaults;
  const missionKeys = Object.keys(MISSIONS.objectives || {}).length;
  const allItems = STATUS.flatMap(x => x.items);
  const overall = Math.round(allItems.reduce((a, it) => a + it.p, 0) / allItems.length);
  const countBy = s => allItems.filter(it => it.s === s).length;

  m.innerHTML = `
    <h2>Overview — implementation status</h2>

    <div class="card">
      <div class="row" style="gap:18px; margin-bottom:6px">
        <b style="font-size:15px; min-width:210px">Overall project progress</b>
        <div class="grow" style="max-width:520px">${pbar(overall, true)}</div>
      </div>
      <div class="legend">
        <span><span class="sw" style="background:var(--ok)"></span>90–100% done</span>
        <span><span class="sw" style="background:var(--accent2)"></span>60–89% mostly</span>
        <span><span class="sw" style="background:var(--warn)"></span>35–59% partial</span>
        <span><span class="sw" style="background:var(--danger)"></span>&lt;35% early / blocked</span>
        <span style="margin-left:auto">
          <span class="tag in">${countBy("in")} IN</span>
          <span class="tag partial">${countBy("partial")} PARTIAL</span>
          <span class="tag blocked">${countBy("blocked")} BLOCKED</span>
          <span class="tag planned">${countBy("planned")} PLANNED</span>
        </span>
      </div>
    </div>

    ${STATUS.map(cat => {
      const avg = catAvg(cat);
      return `
      <div class="cathead">
        <h3>${cat.cat}</h3>
        <div class="pbar">${`<div class="pfill" style="width:${avg}%;background:${pctColor(avg)}"></div><span class="pnum">${avg}%</span>`}</div>
        <span class="catdesc">${cat.desc}</span>
      </div>
      <div class="card" style="margin-top:0">
        ${cat.items.map(it => `
          <div class="statrow">
            <span class="statname">${it.n}</span>
            <span class="tag ${it.s}">${it.s === "in" ? "IN" : it.s}</span>
            ${pbar(it.p)}
            <span class="statnote">${it.note}</span>
          </div>`).join("")}
      </div>`;
    }).join("")}

    <h3 style="margin-top:26px">Live backend snapshot</h3>
    <div class="card">
      <table>
        <tr><td>Hunters unlocked</td><td><b>${c.heroes.length}</b> / ${d.heroes.length}</td></tr>
        <tr><td>Store bundles advertised</td><td><b>${c.store.bundles.length}</b> / ${d.store.bundles.length}</td></tr>
        <tr><td>Featured carousel</td><td><b>${c.store.featured.length}</b></td></tr>
        <tr><td>Skins owned/advertised</td><td><b>${c.store.skins.length}</b> / ${d.store.skins.length}</td></tr>
        <tr><td>Accessories owned/advertised</td><td><b>${c.store.accessories.length}</b> / ${d.store.accessories.length}</td></tr>
        <tr><td>Wallet</td><td class="mono">${esc(JSON.stringify(c.wallet))}</td></tr>
        <tr><td>Mission objectives tracked</td><td><b>${missionKeys}</b> (manifest: ${(MISSIONS.manifest||[]).length} entries)</td></tr>
        <tr><td>Player accounts with state</td><td><b>${PLAYERS.length}</b></td></tr>
      </table>
    </div>
    <div class="note"><b>How changes reach the game:</b> the client refetches inventory, storefront and
      wallet when it re-enters the menu (or on relaunch) — config edits are not pushed mid-screen.
      Mission progress is fetched by the client-side missions shim on menu load and re-polled, so those
      edits appear on the next modal open.</div>
    <div class="note warn"><b>Known-inert knobs:</b> per-SKU <b>prices</b> are stored but the client currently
      renders prices from packed catalog data (see Wallet &amp; Prices tab). Mission <b>requirements</b>
      (objective names, maxes, descriptions) live in client-side data assets — only <b>progress</b> is
      server-controlled.</div>`;
}

/* ---------------------------------------------------------------- hunters -- */
function renderHunters(m) {
  const owned = new Set(CFG.heroes);
  const defHero = CFG.heroes[0] || "";
  m.innerHTML = `
    <h2>Hunters — unlock / lock</h2>
    <div class="note">Checked hunters are marked <b>IsOwned</b> in the inventory feed → unlocked in the
      ALL HUNTERS roster. Unchecked hunters show the not-owned lock. The <b>default</b> hunter is the
      IsDefault starting entry (first in the list sent to the client).</div>
    <div class="card">
      <div class="row" style="margin-bottom:8px">
        <button class="btn mini" onclick="huntersAll(true)">Unlock all</button>
        <button class="btn mini" onclick="huntersAll(false)">Lock all</button>
        <span class="counts">${owned.size} / ${DATA.defaults.heroes.length} unlocked</span>
      </div>
      <div class="grid">
        ${DATA.defaults.heroes.map(h => `
          <label class="chk ${owned.has(h)?'':'off'}">
            <input type="checkbox" ${owned.has(h)?'checked':''} onchange="toggleHero('${h}', this.checked)">
            <span>${esc(h)}</span>
            <input type="radio" name="defhero" title="default hunter" ${h===defHero?'checked':''}
                   onchange="setDefaultHero('${h}')">
          </label>`).join("")}
      </div>

function storeAll(key, on) {

async function missionSet(key, val) {
  try {
    MISSIONS.objectives = (await api("/api/missions/progress", { method: "PUT",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ objectives: { [key]: val } }) })).objectives;
    delete missionEdits[key];
    toast(key + " → " + val); render();
  } catch (e) { toast(e.message, true); }
}
async function missionsApplyEdits() {
  if (!Object.keys(missionEdits).length) { toast("No edits pending"); return; }
  try {
    MISSIONS.objectives = (await api("/api/missions/progress", { method: "PUT",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ objectives: missionEdits }) })).objectives;
    toast(Object.keys(missionEdits).length + " objective value(s) applied");
    missionEdits = {}; render();
  } catch (e) { toast(e.message, true); }
}
async function missionsResetAll() {
  if (!confirm("Zero ALL mission progress?")) return;
  try {
    MISSIONS.objectives = (await api("/api/missions/progress", { method: "PUT",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ objectives: {}, replace: true }) })).objectives;
    missionEdits = {}; toast("All mission progress reset"); render();
  } catch (e) { toast(e.message, true); }
}
async function missionsCompleteAll() {
  const vals = {};
  for (const e of MISSIONS.manifest || []) vals[e.mission + "/" + e.objective] = e.max;
  if (!Object.keys(vals).length) { toast("No manifest to complete", true); return; }
  try {
    MISSIONS.objectives = (await api("/api/missions/progress", { method: "PUT",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ objectives: vals }) })).objectives;
    missionEdits = {}; toast("All manifest objectives set to max"); render();
  } catch (e) { toast(e.message, true); }
}
async function missionCustom() {
  const k = $("#mkey").value.trim(); if (!k) return;
  await missionSet(k, +$("#mval").value || 0);
}
async function simMatch() {
  const body = { win: $("#m_win").checked, gameMode: $("#m_gameMode").value };
  for (const f of ["placement","knocks","assists","teamWipes","minionKills","bossKills",
                   "chestsOpened","vaultsOpened","bonfiresCaptured","sunrises","purchases","uniqueHeroes"])
    body[f] = +$("#m_" + f).value || 0;
  const who = $("#m_playerId") ? $("#m_playerId").value : "";
  if (who) body.playerId = who;
  try {
    const res = await api("/api/missions/match-result", { method: "POST",
      headers: {"Content-Type":"application/json"}, body: JSON.stringify(body) });
    MISSIONS.objectives = res.objectives;
    const n = Object.keys(res.applied || {}).length;
    // Report the pass grant too, including the "nobody credited" case — otherwise a skipped
    // grant looks identical to a successful one and the operator has no idea why the pass
    // did not move.
    const p = res.pass || {};
    let passMsg;
    if (!p.playerId) {
      passMsg = "no pass XP (no player resolved — pick one above)";
    } else {
      passMsg = `+${p.xpGained||0} pass XP → ${p.playerId}, tier ${p.after ? p.after.level : "?"}`
              + (p.tiersUp ? ` (+${p.tiersUp} tier${p.tiersUp>1?"s":""})` : "");
    }
    $("#matchout").textContent = `${n} objective key(s) advanced · ${passMsg}`;
    toast(`Match recorded — ${n} objective(s), ${passMsg}`);
    await loadPlayers(); // keep the players tab's Hunter's Journey column honest
  } catch (e) { toast(e.message, true); }
}

function st_set(field, v) {
  if (v) curPlayer.state[field] = v; else delete curPlayer.state[field];
}
/* Typed setters. st_set stores STRINGS and drops falsy values, which is wrong for the
   account-pass fields: the server decodes the player doc with DisallowUnknownFields into
   typed Go fields, so a "12" string or a "" bool fails the whole save. */
function st_setNum(field, v) {
  const n = parseInt(v, 10);
  if (Number.isFinite(n) && n > 0) curPlayer.state[field] = n; else delete curPlayer.state[field]; // absent == 0
}
function st_setBool(field, v) { curPlayer.state[field] = !!v; }
function pKvKey(field, oldK, newK) {
  const m = curPlayer.state[field] || {};
  if (newK && newK !== oldK) { m[newK.trim()] = m[oldK]; delete m[oldK]; curPlayer.state[field] = m; render(); }
}
function pKvVal(field, k, v) { (curPlayer.state[field] = curPlayer.state[field] || {})[k] = v.trim(); }
function pKvDel(field, k) { delete (curPlayer.state[field] || {})[k]; render(); }
function pKvAdd(field) {
  const k = $("#nk-" + field).value.trim(), v = $("#nv-" + field).value.trim();
  if (!k) return;
  (curPlayer.state[field] = curPlayer.state[field] || {})[k] = v;
  render();
}
function applyRawState() {
  try { curPlayer.state = JSON.parse($("#rawstate").value); toast("Raw JSON loaded — press Save player to persist"); render(); }
  catch (e) { toast("Bad JSON: " + e.message, true); }
}
async function savePlayer() {
  try {
    await api("/api/players/" + encodeURIComponent(curPlayer.id), { method: "PUT",
      headers: {"Content-Type":"application/json"}, body: JSON.stringify(curPlayer.state) });
    toast("Player saved (loadout version bumped)");
    await loadPlayers();
    curPlayer = null; render();
  } catch (e) { toast("Save failed: " + e.message, true); }
}
async function deletePlayer(id) {
  if (!confirm("Reset ALL state for " + id + "? (equips, profile, selected hunter)")) return;
  try {
    await api("/api/players/" + encodeURIComponent(id), { method: "DELETE" });
    toast("Player state reset");
    await loadPlayers(); render();
  } catch (e) { toast(e.message, true); }
}

/* ------------------------------------------------------------------- boot -- */
let bootError = null;
let bootTimer = null;
async function boot() {
  clearTimeout(bootTimer);
  try {
    await Promise.all([loadConfig(), loadMissions(), loadPlayers()]);
    bootError = null;
  } catch (e) {
    // Page can load while ags is mid-restart (rebuild loop) — keep retrying so
    // the panel comes alive as soon as the backend does, instead of sitting on
    // "Loading…" until a manual refresh.
    bootError = e.message;
    bootTimer = setTimeout(boot, 3000);
  }
  render();
}
boot();
</script>
